<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70" fill="none">
  <!-- Emblem on Right in RTL -->
  <g transform="translate(250, 5)">
    <!-- Golden Circle Ring -->
    <circle cx="30" cy="30" r="26" stroke="#D4A24C" stroke-width="2.5" fill="none" opacity="0.95" />
    
    <!-- Crescent curve inside -->
    <path d="M 20 12 C 14 18, 14 42, 28 48 C 16 46, 15 22, 23 14 Z" fill="#E5B55D" />
    
    <!-- Star -->
    <path d="M 22 22 L 23.5 25.5 L 27 27 L 23.5 28.5 L 22 32 L 20.5 28.5 L 17 27 L 20.5 25.5 Z" fill="#E5B55D" />
    
    <!-- Stylized GV monogram -->
    <path d="M 23 30 L 32 48 L 41 22" stroke="#E5B55D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 28 39 L 36 39" stroke="#E5B55D" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Airplane taking off towards top-right -->
    <path d="M 40 18 L 47 11 L 49 14 L 45 19 L 47 22 L 44 21 L 42 24 L 41 22 L 39 21 Z" fill="#E5B55D" />
    
    <!-- Cyan dynamic flourish -->
    <path d="M 28 54 C 36 55, 45 50, 49 42 C 46 47, 38 51, 30 50 Z" fill="#38BDF8" />
  </g>

  <!-- Typography -->
  <g transform="translate(0, 0)">
    <!-- Arabic Brand Name -->
    <text x="240" y="32" font-family="'Cairo', 'Tajawal', sans-serif" font-size="21" font-weight="800" fill="#E5B55D" text-anchor="end" letter-spacing="-0.3">الإجازة الذهبية</text>
    
    <!-- English Subtitle -->
    <text x="240" y="47" font-family="'Montserrat', 'Tajawal', sans-serif" font-size="10.5" font-weight="700" fill="#38BDF8" text-anchor="end" letter-spacing="2.2">GOLDEN VACATION</text>
    
    <!-- Tourism Tagline -->
    <text x="240" y="60" font-family="'Cairo', 'Tajawal', sans-serif" font-size="8.5" font-weight="500" fill="#94A3B8" text-anchor="end" letter-spacing="0.5">للسياحة والسفر</text>
  </g>
</svg>